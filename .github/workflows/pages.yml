name: GitHub Pages portal
on:
  pull_request:
    branches: [main]
    paths:
      - 'catalog/**'
      - 'domains/**'
      - 'profiles/**'
      - 'workflows/**'
      - 'scripts/build_portal.py'
      - 'tests/test_portal_build.py'
      - 'site/**'
      - '.github/workflows/pages.yml'
  push:
    branches: [main]
    paths:
      - 'catalog/**'
      - 'domains/**'
      - 'profiles/**'
      - 'workflows/**'
      - 'scripts/build_portal.py'
      - 'tests/test_portal_build.py'
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build curated portal artifact
        run: python scripts/build_portal.py
      - name: Validate generated portal artifact
        run: python tests/test_portal_build.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PAGES_PUBLISH_ENABLED == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
